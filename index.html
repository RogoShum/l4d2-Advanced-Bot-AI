<div id="layersPop" class="pop glass">
 <h3>图层</h3>
 <div class="row"><label for="xray">穿墙显示生还者</label><input type="checkbox" class="switch" id="xray" checked></div>
 <div class="row"><label for="labels">名字与血量标签</label><input type="checkbox" class="switch" id="labels" checked></div>
 <hr>
 <div class="row"><label for="trail">轨迹</label><select id="trail"><option value="0">关闭</option><option value="3">3 秒</option><option value="8" selected>8 秒</option><option value="20">20 秒</option><option value="60">60 秒</option><option value="all">整局</option></select></div>
 <div class="row"><label for="nav">NavMesh</label><input type="checkbox" class="switch" id="nav"></div>
 <div class="row"><label for="hitbox" title="火焰与酸液显示原生伤害球域；命中取决于目标碰撞体最近点，接地酸液目标的脚部高度条件，以及原生要求的地图遮挡检测。">Hitbox</label><input type="checkbox" class="switch" id="hitbox"></div>
 <div class="row"><label for="fps" title="右下角显示实际渲染帧率与每帧 CPU 时间">帧率 / 帧时间</label><input type="checkbox" class="switch" id="fps" checked></div>
 <div class="row" id="botaiRow" hidden><label for="botai" title="BotAI 寻路与移动：彩色实线=脚本路线（淡色为已走过，橙色段为跳跃/梯子），白圈=当前路点，黄菱形+虚线=实际发出的原生 MOVE 目标，青箭头=局部转向选中方向（灰线为被否决方向），灰虚线=原生查询路线，红叉=被拒绝的原生连接，橙线=阻塞连接，红线/红圈=逃生路线与终点，紫圈=Tank 场目标，绿旗=团队任务目标。跟随某个生还者时只显示该生还者并带全部细节。">BotAI 决策路径</label><input type="checkbox" class="switch" id="botai"></div>
 <div class="row"><label for="slice">切掉上层遮挡</label><input type="checkbox" class="switch" id="slice" checked></div>
 <div class="row"><label for="cut">切层高度</label><input type="range" id="cut" min="60" max="800" step="10" value="120"></div>
</div>

<div id="settingsPop" class="pop glass">
 <h3>画质</h3>
 <div class="row"><label title="写实：地图、道具与人物都按游戏的光照数据着色（光照贴图、静态道具顶点光、环境光立方体与灯光）；卡通：同样的光照分成色阶">画面风格</label><div class="seg" id="charStyle"><button class="btn" data-style="real">写实</button><button class="btn" data-style="toon">卡通</button></div></div>
 <div class="row"><label>预设</label><div class="seg" id="presets"><button class="btn" data-preset="high">高</button><button class="btn" data-preset="medium">中</button><button class="btn" data-preset="low">低</button></div></div>
 <hr>
 <div class="row"><label for="q_shadows">阴影</label><input type="checkbox" class="switch" id="q_shadows"></div>
 <div class="row"><label for="q_softShadows" title="PCSS：先找遮挡物，再按遮挡距离决定阴影边缘的柔和程度（接触处锐利，远处柔和）；每像素约多 24 次阴影采样">柔和阴影</label><input type="checkbox" class="switch" id="q_softShadows"></div>
 <div class="row"><label for="q_outline">卡通描边</label><input type="checkbox" class="switch" id="q_outline"></div>
 <div class="row"><label for="q_ao">环境光遮蔽</label><input type="checkbox" class="switch" id="q_ao"></div>
 <div class="row"><label for="q_bloom">泛光</label><input type="checkbox" class="switch" id="q_bloom"></div>
 <div class="row"><label for="q_fxaa">抗锯齿</label><input type="checkbox" class="switch" id="q_fxaa"></div>
 <div class="row"><label for="q_glass">界面毛玻璃</label><input type="checkbox" class="switch" id="q_glass"></div>
 <div class="row"><label for="q_scale">渲染分辨率</label><select id="q_scale"><option value="0.67">67%</option><option value="0.8">80%</option><option value="1">100%</option><option value="1.5">150%</option></select></div>
</div>
<div id="generalPop" class="pop glass">

 <div class="row"><label for="firstFov">第一人称垂直 FOV · <output id="fovLabel" for="firstFov"></output>°</label><input type="range" id="firstFov" min="40" max="120" step="1"></div>
 <div class="row"><label for="isometric">正交投影（环绕、飞行）</label><input type="checkbox" class="switch" id="isometric"></div>

 <div class="row"><label for="mapLighting">地图原定光照</label><input type="checkbox" class="switch" id="mapLighting"></div>
 <div class="row"><label for="audioOn" title="播放生还者、特感、普感的声音与尸潮音乐（3D 方位，按游戏的声级衰减）。浏览器要求先点击页面才会出声。">声音</label><input type="checkbox" class="switch" id="audioOn"></div>

 <div class="row"><label for="audioSpeed" title="快放时如何处理声音">倍速时声音</label><select id="audioSpeed"><option value="1x">仅 1× 播放</option><option value="2x">2× 及以下播放</option><option value="pitch">任意倍速（变调）</option></select></div>
 <div class="row"><label for="fogMode" title="雾的距离从跟随的生还者处算起（与游戏中玩家视角一致），不从远处的镜头算起">雾</label><select id="fogMode"><option value="map">地图原值</option><option value="half">减弱一半</option><option value="off">关闭</option></select></div>
 <div class="row"><label for="timeOfDay">时间 · <span id="timeOfDayLabel">12:00</span></label><input type="range" id="timeOfDay" min="0" max="24" step="0.1" style="width:140px"></div>
 <hr>
 <div class="row"><label>游戏目录</label><button class="btn" id="changeDirectory">更换</button></div>
 <div class="muted" id="gameDir" style="font-size:11px;padding:0 4px;word-break:break-all"></div>
 <div class="muted" id="assetStatus" style="font-size:11px;padding:6px 4px 0"></div>
</div>

</div>
